# Alerts on, PRs off.
# - Dependabot *alerts* are enabled in the repo settings, so new CVEs in the
#   lockfiles show under Security → Vulnerabilities.
# - Dependabot *security updates* (auto-fix PRs) stay disabled in the repo
#   settings, and version-update PRs are switched off here
#   (open-pull-requests-limit: 0): they were mostly noise. Dependency bumps
#   are done by hand in release branches.
# - .github/workflows/security-rescan.yml re-scans the shipped images and
#   lockfiles with Trivy every week, into Code scanning.
# The file stays so Scorecard's Dependency-Update-Tool check still finds it;
# raise a limit to turn an ecosystem's PRs back on.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
