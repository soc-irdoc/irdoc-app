name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ── Backend: lint, security, test ──────────────────────────────────────────
  test-backend:
    name: Backend — Test & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: irp_test
          POSTGRES_USER: irp
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install dependencies
        run: pip install --require-hashes -r backend/requirements.lock.txt && pip install pip-audit ruff

      - name: Verify pip lock file is in sync with requirements.txt
        run: |
          # Pinned to match the pip-tools version used to generate the committed
          # lock file locally. If you bump this, regenerate+recommit
          # backend/requirements.lock.txt with the same version to avoid
          # pip-tools-version-driven formatting drift tripping this check.
          pip install pip-tools==7.6.1
          # Regenerate into a separate dir using the SAME output filename as the
          # committed lock file: pip-compile embeds --output-file's value into its
          # autogenerated header comment, so comparing against a differently-named
          # file (e.g. requirements.lock.check.txt) would always show a diff on
          # that header line alone, even with zero actual drift.
          mkdir -p /tmp/lock-check
          cp backend/requirements.txt /tmp/lock-check/
          # ALSO seed the scratch dir with the CURRENTLY COMMITTED lock file
          # under that same output filename. pip-compile treats an existing
          # --output-file as the prior resolution and only moves the pins
          # that requirements.txt actually forces it to move, keeping every
          # other transitive package at its already-locked version. Without
          # this seed file, pip-compile has no prior resolution to anchor to
          # and re-resolves the ENTIRE transitive graph against whatever is
          # latest on PyPI right now — which would fail this check any time
          # some unrelated transitive dependency ships a new release, even
          # with zero real requirements.txt drift.
          cp backend/requirements.lock.txt /tmp/lock-check/
          (cd /tmp/lock-check && pip-compile --generate-hashes --output-file=requirements.lock.txt requirements.txt)
          # pip-compile's autogenerated header ALSO embeds the Python major.minor
          # version of the interpreter that ran it (e.g. "Python 3.12" here in CI
          # vs. whatever version was used to regenerate the committed file on a
          # dev machine, e.g. "Python 3.14"). That has nothing to do with real
          # requirements.txt drift, so strip every column-0 "#" header line from
          # both sides before diffing. Per-package "# via ..." annotation lines
          # are indented (not column-0), so they're untouched here — a real
          # change to the dependency graph still fails the check.
          diff -q <(grep -v '^#' backend/requirements.lock.txt) <(grep -v '^#' /tmp/lock-check/requirements.lock.txt) || \
            (echo "::error::backend/requirements.lock.txt is out of sync with requirements.txt — run 'pip-compile --generate-hashes --output-file=backend/requirements.lock.txt backend/requirements.txt' and commit the result" && exit 1)

      - name: Security audit (pip-audit)
        # PYSEC-2026-1325: Minerva timing attack on ecdsa's P-256 signing, unfixed
        # upstream by design. ecdsa is a hard dependency of python-jose but this
        # codebase only ever uses HS256/RS256 (see app/core/security.py, oidc.py),
        # never ES256, so the vulnerable code path is unreachable here.
        run: pip-audit --requirement backend/requirements.lock.txt --ignore-vuln GHSA-wfm5-v35h-vwf4 --ignore-vuln PYSEC-2026-1325

      - name: Lint (ruff)
        run: cd backend && ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://irp:testpassword@localhost/irp_test
          TEST_DATABASE_URL: postgresql+asyncpg://irp:testpassword@localhost/irp_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_not_for_production_use_at_all
          STORAGE_BACKEND: local
          STORAGE_PATH: /tmp/irp_test_storage
          BASE_URL: http://localhost:3000
          EMAIL_BACKEND: console
        run: cd backend && pytest --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend

  # ── Frontend: type-check, lint, audit, build ──────────────────────────────
  test-frontend:
    name: Frontend — Type Check, Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Security audit (npm audit)
        run: cd frontend && npm audit --audit-level=high

      - name: Type check
        run: cd frontend && npm run type-check

      - name: Lint
        run: cd frontend && npm run lint

      - name: Build
        run: cd frontend && npm run build

      - name: Check bundle size
        run: |
          # Verify initial JS bundle is under 200KB gzipped
          BUNDLE=$(find frontend/dist/assets -name "*.js" | head -1)
          if [ -n "$BUNDLE" ]; then
            SIZE=$(gzip -c "$BUNDLE" | wc -c)
            echo "Bundle size (gzipped): ${SIZE} bytes"
            if [ "$SIZE" -gt 204800 ]; then
              echo "WARNING: Initial bundle exceeds 200KB gzipped target (${SIZE} bytes)"
            fi
          fi

  # ── Build & Push Docker images (on merge to main) ─────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (for arm64 cross-compile)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/soc-irdoc/irdoc-backend:latest
            ghcr.io/soc-irdoc/irdoc-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/soc-irdoc/irdoc-frontend:latest
            ghcr.io/soc-irdoc/irdoc-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Baseline triaged (2026-09-11): the first pass surfaced 961 alerts,
      # 98% of which had no fix available (unfixed upstream/distro CVEs with
      # no actionable remediation) and don't belong in code scanning noise.
      # `ignore-unfixed` drops those; `severity` still limits to Trivy's own
      # CRITICAL/HIGH bucket. Report-only for now (exit-code 0) until we've
      # watched a few clean runs.
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/soc-irdoc/irdoc-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/soc-irdoc/irdoc-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload backend Trivy results to code scanning
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload frontend Trivy results to code scanning
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  # ── Tag versioned release images ──────────────────────────────────────────
  # No `needs: [build-and-push]` here on purpose: that job only runs on
  # `push` (see its own `if:` above), so on a `release` event it is always
  # skipped — and a job that needs a skipped job is skipped too, regardless
  # of its own `if:`. This job instead retags the `:${{ github.sha }}` image
  # that an earlier push-triggered build-and-push run already published for
  # this same commit.
  release:
    name: Release — Tag Docker Images
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        # Release tags are named "vX.Y.Z" (or "vX.Y.Z-alpha"), but VERSION
        # (the repo-root VERSION file, docker/.env, and docker-compose's
        # ${VERSION:-latest}) is stored without the "v". Strip both the
        # "refs/tags/" prefix and a leading "v" so the image tag this job
        # creates actually matches what the app looks for.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${tag#v}" >> $GITHUB_OUTPUT

      - name: Tag backend with version
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/soc-irdoc/irdoc-backend:${{ steps.version.outputs.VERSION }} \
            ghcr.io/soc-irdoc/irdoc-backend:${{ github.sha }}

      - name: Tag frontend with version
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/soc-irdoc/irdoc-frontend:${{ steps.version.outputs.VERSION }} \
            ghcr.io/soc-irdoc/irdoc-frontend:${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          body_path: CHANGELOG.md
          files: |
            docker/docker-compose.prod.yml
            docker/upgrade.sh
            docker/backup.sh
