name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ── Backend: lint, security, test ──────────────────────────────────────────
  test-backend:
    name: Backend — Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: irp_test
          POSTGRES_USER: irp
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pip-audit ruff

      - name: Security audit (pip-audit)
        # PYSEC-2026-1325: Minerva timing attack on ecdsa's P-256 signing, unfixed
        # upstream by design. ecdsa is a hard dependency of python-jose but this
        # codebase only ever uses HS256/RS256 (see app/core/security.py, oidc.py),
        # never ES256, so the vulnerable code path is unreachable here.
        run: pip-audit --requirement backend/requirements.txt --ignore-vuln GHSA-wfm5-v35h-vwf4 --ignore-vuln PYSEC-2026-1325

      - name: Lint (ruff)
        run: cd backend && ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://irp:testpassword@localhost/irp_test
          TEST_DATABASE_URL: postgresql+asyncpg://irp:testpassword@localhost/irp_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_not_for_production_use_at_all
          STORAGE_BACKEND: local
          STORAGE_PATH: /tmp/irp_test_storage
          BASE_URL: http://localhost:3000
          EMAIL_BACKEND: console
        run: cd backend && pytest --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend

  # ── Frontend: type-check, lint, audit, build ──────────────────────────────
  test-frontend:
    name: Frontend — Type Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Security audit (npm audit)
        run: cd frontend && npm audit --audit-level=high

      - name: Type check
        run: cd frontend && npm run type-check

      - name: Lint
        run: cd frontend && npm run lint

      - name: Build
        run: cd frontend && npm run build

      - name: Check bundle size
        run: |
          # Verify initial JS bundle is under 200KB gzipped
          BUNDLE=$(find frontend/dist/assets -name "*.js" | head -1)
          if [ -n "$BUNDLE" ]; then
            SIZE=$(gzip -c "$BUNDLE" | wc -c)
            echo "Bundle size (gzipped): ${SIZE} bytes"
            if [ "$SIZE" -gt 204800 ]; then
              echo "WARNING: Initial bundle exceeds 200KB gzipped target (${SIZE} bytes)"
            fi
          fi

  # ── Build & Push Docker images (on merge to main) ─────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU (for arm64 cross-compile)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/soc-irdoc/irdoc-backend:latest
            ghcr.io/soc-irdoc/irdoc-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/soc-irdoc/irdoc-frontend:latest
            ghcr.io/soc-irdoc/irdoc-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report-only for now (exit-code 0): this is the first pass at scanning
      # these images, so we don't yet know the baseline noise from the base
      # images. Findings land in the job log/SARIF; tighten to exit-code 1
      # once the baseline has been triaged.
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/soc-irdoc/irdoc-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/soc-irdoc/irdoc-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      # Code scanning (Security tab) requires GitHub Advanced Security, which
      # isn't available on private repos on the free plan. This activates on
      # its own once the repo goes public.
      - name: Upload Trivy results to code scanning
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: .

  # ── Tag versioned release images ──────────────────────────────────────────
  release:
    name: Release — Tag Docker Images
    needs: [build-and-push]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Tag backend with version
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/soc-irdoc/irdoc-backend:${{ steps.version.outputs.VERSION }} \
            ghcr.io/soc-irdoc/irdoc-backend:${{ github.sha }}

      - name: Tag frontend with version
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/soc-irdoc/irdoc-frontend:${{ steps.version.outputs.VERSION }} \
            ghcr.io/soc-irdoc/irdoc-frontend:${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          body_path: CHANGELOG.md
          files: |
            docker/docker-compose.prod.yml
            docker/upgrade.sh
            docker/backup.sh
