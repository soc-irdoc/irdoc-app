name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  # ── Backend: lint, security, test ──────────────────────────────────────────
  test-backend:
    name: Backend — Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: irp_test
          POSTGRES_USER: irp
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Security audit (pip-audit)
        run: pip-audit --requirement backend/requirements.txt --ignore-vuln GHSA-wfm5-v35h-vwf4

      - name: Lint (ruff)
        run: cd backend && ruff check .

      - name: Secret leak check
        run: |
          if grep -rn "irp_key_\|sk-ant-\|AKIA\|sk-proj-" backend/app/ 2>/dev/null | grep -v "\.pyc"; then
            echo "ERROR: Potential secret found in source code"
            exit 1
          fi
          echo "Secret check passed."

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://irp:testpassword@localhost/irp_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_not_for_production_use_at_all
          STORAGE_BACKEND: local
          STORAGE_PATH: /tmp/irp_test_storage
          BASE_URL: http://localhost:3000
          EMAIL_BACKEND: console
        run: cd backend && pytest --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend

  # ── Frontend: type-check, lint, audit, build ──────────────────────────────
  test-frontend:
    name: Frontend — Type Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Security audit (npm audit)
        run: cd frontend && npm audit --audit-level=high

      - name: Type check
        run: cd frontend && npm run type-check

      - name: Lint
        run: cd frontend && npm run lint

      - name: Build
        run: cd frontend && npm run build

      - name: Check bundle size
        run: |
          # Verify initial JS bundle is under 200KB gzipped
          BUNDLE=$(find frontend/dist/assets -name "*.js" | head -1)
          if [ -n "$BUNDLE" ]; then
            SIZE=$(gzip -c "$BUNDLE" | wc -c)
            echo "Bundle size (gzipped): ${SIZE} bytes"
            if [ "$SIZE" -gt 204800 ]; then
              echo "WARNING: Initial bundle exceeds 200KB gzipped target (${SIZE} bytes)"
            fi
          fi

  # ── Build & Push Docker images (on merge to main) ─────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-compile)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            irpdoc/irpdoc-backend:latest
            irpdoc/irpdoc-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            irpdoc/irpdoc-frontend:latest
            irpdoc/irpdoc-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Tag versioned release images ──────────────────────────────────────────
  release:
    name: Release — Tag Docker Images
    needs: [build-and-push]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Tag backend with version
        run: |
          docker buildx imagetools create \
            --tag irpdoc/irpdoc-backend:${{ steps.version.outputs.VERSION }} \
            irpdoc/irpdoc-backend:${{ github.sha }}

      - name: Tag frontend with version
        run: |
          docker buildx imagetools create \
            --tag irpdoc/irpdoc-frontend:${{ steps.version.outputs.VERSION }} \
            irpdoc/irpdoc-frontend:${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG.md
          files: |
            docker/docker-compose.prod.yml
            docker/upgrade.sh
            docker/backup.sh
