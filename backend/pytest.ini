[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Actual coverage is ~48% (2026-09-08); gate set a few points below that so
# CI is green today without masking further regressions. Raise this as real
# test coverage is added — it should not stay this low long-term.
addopts = --cov=app --cov-report=term-missing --cov-fail-under=45
