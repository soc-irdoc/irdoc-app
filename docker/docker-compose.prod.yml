# Production Docker Compose for IRDoc
# Usage: python3 installer/wizard.py  (wizard writes docker/.env, then runs compose)
# See docs/installation/docker-compose.md for full setup guide.

name: irdoc-app

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  SECRET_KEY: ${SECRET_KEY}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_PATH: /app/storage
  BASE_URL: ${BASE_URL}
  LICENSE_KEY: ${LICENSE_KEY:-}
  AI_BACKEND: ${AI_BACKEND:-}
  AI_MODEL: ${AI_MODEL:-claude-sonnet-4-6}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
  WEBHOOK_RATE_LIMIT: ${WEBHOOK_RATE_LIMIT:-20}
  WEBHOOK_MAX_PAYLOAD_BYTES: ${WEBHOOK_MAX_PAYLOAD_BYTES:-65536}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  MSSP_MODE: ${MSSP_MODE:-false}
  VERSION: ${VERSION:-latest}

services:
  db:
    image: postgres:16-alpine
    container_name: irdoc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: irp
      POSTGRES_USER: irp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: irdoc-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --notify-keyspace-events Ex
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/soc-irdoc/irdoc-backend:${VERSION:-latest}
    container_name: irdoc-backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - ./storage:/app/storage
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  ollama:
    image: ollama/ollama:latest
    container_name: irdoc-ollama
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: ghcr.io/soc-irdoc/irdoc-backend:${VERSION:-latest}
    container_name: irdoc-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -c 4 -Q default,reports,enrichment,ai --loglevel=warning
    environment: *backend-env
    volumes:
      - ./storage:/app/storage
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 5 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  beat:
    image: ghcr.io/soc-irdoc/irdoc-backend:${VERSION:-latest}
    container_name: irdoc-beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=warning --schedule /app/backups/celerybeat-schedule
    environment: *backend-env
    volumes:
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/soc-irdoc/irdoc-frontend:${VERSION:-latest}
    container_name: irdoc-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  ollama_data:
