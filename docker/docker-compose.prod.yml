version: '3.9'

# Production Docker Compose for IRDoc
# Usage: docker compose -f docker-compose.prod.yml up -d
# See docs/installation/docker-compose.md for full setup guide.

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  SECRET_KEY: ${SECRET_KEY}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_PATH: /app/storage
  BASE_URL: ${BASE_URL}
  LICENSE_KEY: ${LICENSE_KEY:-}
  AI_BACKEND: ${AI_BACKEND:-}
  AI_MODEL: ${AI_MODEL:-claude-sonnet-4-6}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
  WEBHOOK_RATE_LIMIT: ${WEBHOOK_RATE_LIMIT:-20}
  WEBHOOK_MAX_PAYLOAD_BYTES: ${WEBHOOK_MAX_PAYLOAD_BYTES:-65536}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  MSSP_MODE: ${MSSP_MODE:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: irp
      POSTGRES_USER: irp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irp"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed externally — only accessible within Docker network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # notify-keyspace-events Ex required for SharePoint debounce expiry
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --notify-keyspace-events Ex
      --save 60 1
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: soc-irdoc/irdoc-backend:${VERSION:-latest}
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - ./storage:/app/storage
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    # Not exposed directly — traffic goes through nginx (frontend service)

  worker:
    image: soc-irdoc/irdoc-backend:${VERSION:-latest}
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -c 4 -Q default,reports,enrichment --loglevel=warning
    environment: *backend-env
    volumes:
      - ./storage:/app/storage
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: soc-irdoc/irdoc-backend:${VERSION:-latest}
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=warning
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: soc-irdoc/irdoc-frontend:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
