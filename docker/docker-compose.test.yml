version: '3.9'

# Minimal PostgreSQL instance for running integration tests locally.
# Usage:
#   docker compose -f docker/docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql+asyncpg://irp:testpassword@localhost:5433/irp_test pytest
#   docker compose -f docker/docker-compose.test.yml down

name: irdoc-test

services:
  db-test:
    image: postgres:16-alpine
    container_name: irdoc-db-test
    environment:
      POSTGRES_DB: irp_test
      POSTGRES_USER: irp
      POSTGRES_PASSWORD: testpassword
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "irp"]
      interval: 5s
      timeout: 3s
      retries: 5
