# DEPRECATED: renamed to https.conf, which is identical below the header.
# This copy stays for one release because existing scripts and docs refer to
# it; it will be removed after 0.2.0-alpha. Use https.conf instead.
#
# demo.irdoc.io uses it with a Cloudflare Origin CA certificate in
# docker/ssl/{cert,key}.pem (Cloudflare "Full (strict)" mode).
#
# Use it as this install's own config (docker/nginx/local/ is git-ignored, so
# upgrades never overwrite it):
#   cp docker/nginx/examples/demo-https.conf docker/nginx/local/nginx.conf
#   docker compose -f docker/docker-compose.prod.yml restart frontend
#
# Below this header the file is exactly what the installer generates
# (installer/core/ssl.py::generate_nginx_conf); a test keeps them in sync.

upstream backend {
    server irdoc-backend:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/irdoc-security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 55m;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
