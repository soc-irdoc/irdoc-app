# Behind a load balancer that re-encrypts: the load balancer (Avi, F5,
# HAProxy, a cloud LB, ...) terminates the client's TLS and opens a new TLS
# connection to this server on port 443. nginx serves TLS with the
# certificate in docker/ssl/ (a self-signed one is fine if the load balancer
# doesn't validate it). Point the pool at :443 and use an HTTPS health
# monitor on GET / (expects 200).
#
# REPLACE 192.0.2.0/24 below with the address(es) the load balancer connects
# from (its SNAT / service-engine subnet), one set_real_ip_from line each.
# Only those are trusted to say who the client is.
#
# Use it as this install's own config (docker/nginx/local/ is git-ignored, so
# upgrades never overwrite it):
#   cp docker/nginx/examples/lb-reencrypt.conf docker/nginx/local/nginx.conf
#   docker compose -f docker/docker-compose.prod.yml restart frontend
#
# Below this header the file is exactly what the installer generates
# (installer/core/ssl.py::generate_nginx_conf); a test keeps them in sync.

upstream backend {
    server irdoc-backend:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/irdoc-security-headers.conf;

    # Client IPs: trust X-Forwarded-For only from the load balancer.
    set_real_ip_from 192.0.2.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 55m;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
