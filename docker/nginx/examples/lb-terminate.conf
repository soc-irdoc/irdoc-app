# Behind a load balancer that terminates TLS: the load balancer (Avi, F5,
# HAProxy, a cloud LB, ...) handles HTTPS and forwards plain HTTP to this
# server on port 80. It must send X-Forwarded-For and
# X-Forwarded-Proto: https. Point the pool at :80 and use an HTTP health
# monitor on GET / (expects 200). Set BASE_URL in docker/.env to the public
# https:// URL users type.
#
# REPLACE 192.0.2.0/24 below with the address(es) the load balancer connects
# from (its SNAT / service-engine subnet), one set_real_ip_from line each.
# Only those are trusted to say who the client is.
#
# Allow ports 80/443 on this server from the load balancer only.
#
# Use it as this install's own config (docker/nginx/local/ is git-ignored, so
# upgrades never overwrite it):
#   cp docker/nginx/examples/lb-terminate.conf docker/nginx/local/nginx.conf
#   docker compose -f docker/docker-compose.prod.yml restart frontend
#
# Below this header the file is exactly what the installer generates
# (installer/core/ssl.py::generate_nginx_conf); a test keeps them in sync.

upstream backend {
    server irdoc-backend:8000;
}

map $http_x_forwarded_proto $irdoc_forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/irdoc-security-headers.conf;

    # Client IPs: trust X-Forwarded-For only from the load balancer.
    set_real_ip_from 192.0.2.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $irdoc_forwarded_proto;
        client_max_body_size 55m;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
