# HTTPS nginx config for demo.irdoc.io — Cloudflare "Full (strict)" mode.
#
# The default docker/nginx/nginx.conf (used by real installs) is plain HTTP,
# because a real install's HTTPS config is normally generated by the
# installer wizard (installer/core/ssl.py::generate_nginx_conf("import")) once
# the operator uploads their own certificate. The demo VPS is deployed by
# script rather than through the interactive wizard, so this file is a static
# copy of that same "import" mode template, wired to the Cloudflare Origin CA
# cert placed at docker/ssl/{cert,key}.pem.
#
# One-time setup: on the demo VPS only, copy this over the real config:
#   cp docker/nginx/nginx.demo-https.conf docker/nginx/nginx.conf
# (docker/demo-restore.sh does not touch nginx config, so this only needs
# doing once, before the first `docker compose up -d`.)

upstream backend {
    server irdoc-backend:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 55m;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
