<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRDoc Documentation</title>
  <meta name="description" content="IRDoc documentation — installation, user guide, admin guide, and API reference.">
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link id="hljs-theme" rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH"
    crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
    integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"
    integrity="sha384-YTBHtsL8yVTHcLakYNyrOfK3K+QQcXiECuaALJ+3j7Mo681Rtzadt8NR6WrZH+eQ"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"
    integrity="sha384-PCSoOZTpbkikBEtd/+uV3WNdc676i9KUf01KOA8CnJotvlx8rRrETbDuwdjqTYvt"
    crossorigin="anonymous"></script>
  <style>
/* ══ TOKENS — DARK (default) ══ */
:root {
  --bg:         #080b12;
  --bg-2:       #0d1117;
  --bg-3:       #10141c;
  --bg-4:       #161b26;
  --bg-5:       #1c2333;
  --border:     #2a3344;
  --border-hi:  #3d4f66;
  --text:       #e6edf3;
  --text-2:     #8b949e;
  --text-3:     #484f58;
  --accent:     #f97316;
  --accent-2:   #fb923c;
  --accent-dim: rgba(249,115,22,.12);
  --accent-glow:rgba(249,115,22,.3);
  --green:      #3fb950;
  --yellow:     #e3b341;
  --red:        #f85149;
  --blue:       #58a6ff;
  --purple:     #bc8cff;
  --mono:       'JetBrains Mono', monospace;
  --sans:       'Syne', sans-serif;
  --nav-h:      60px;
  --sidebar-w:  280px;
  --toc-w:      220px;
  --content-max:760px;
  --radius:     8px;
  --code-bg:    #161b26;
  --callout-note-bg:    rgba(88,166,255,.08);
  --callout-note-border:rgba(88,166,255,.5);
  --callout-warn-bg:    rgba(227,179,65,.08);
  --callout-warn-border:rgba(227,179,65,.5);
  --callout-tip-bg:     rgba(63,185,80,.08);
  --callout-tip-border: rgba(63,185,80,.5);
}

/* ══ LIGHT MODE ══ */
body.light {
  --bg:         #ffffff;
  --bg-2:       #f6f8fa;
  --bg-3:       #eaeef2;
  --bg-4:       #e1e4e8;
  --bg-5:       #d0d7de;
  --border:     #d0d7de;
  --border-hi:  #afb8c1;
  --text:       #1f2328;
  --text-2:     #636c76;
  --text-3:     #8c959f;
  --code-bg:    #f6f8fa;
  --callout-note-bg:    rgba(9,105,218,.06);
  --callout-note-border:rgba(9,105,218,.4);
  --callout-warn-bg:    rgba(154,103,0,.06);
  --callout-warn-border:rgba(154,103,0,.4);
  --callout-tip-bg:     rgba(26,127,55,.06);
  --callout-tip-border: rgba(26,127,55,.4);
}

/* ══ RESET ══ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans); background: var(--bg-2); color: var(--text);
  line-height: 1.6; overflow-x: hidden;
  transition: background .2s, color .2s;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ══ NAV ══ */
#nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  background: rgba(8,11,18,.9); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  transition: background .2s;
}
body.light #nav { background: rgba(255,255,255,.92); }
.nav-left  { display: flex; align-items: center; gap: 12px; }
.nav-right { display: flex; align-items: center; gap: 10px; }
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--sans); font-weight: 800; font-size: 17px;
  color: var(--text); text-decoration: none;
}
.nav-logo:hover { text-decoration: none; }
.nav-logo img { height: 36px; width: auto; }
.logo-sep  { color: var(--border-hi); font-weight: 400; margin: 0 2px; }
.logo-docs { color: var(--text-2); font-weight: 600; font-size: 15px; }
.version-badge {
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  color: var(--accent); background: var(--accent-dim);
  border: 1px solid rgba(249,115,22,.3);
  border-radius: 100px; padding: 3px 10px;
}
.icon-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-2); border-radius: var(--radius);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  height: 36px; padding: 0 10px; gap: 6px;
  font-size: 15px; font-family: var(--sans); font-weight: 600;
  transition: background .15s, color .15s, border-color .15s;
}
.icon-btn:hover { background: var(--bg-4); color: var(--text); border-color: var(--border-hi); }
#cmd-k-btn { font-size: 13px; padding: 0 12px; }
#cmd-k-btn kbd {
  font-family: var(--mono); font-size: 10px;
  background: var(--bg-4); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px; color: var(--text-3);
}
.mobile-menu-btn { display: none; }

/* ══ LAYOUT ══ */
.layout {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr var(--toc-w);
  grid-template-areas: "sidebar main toc";
  margin-top: var(--nav-h);
  min-height: calc(100vh - var(--nav-h));
}

/* ══ SIDEBAR ══ */
.sidebar {
  grid-area: sidebar;
  position: sticky; top: var(--nav-h);
  height: calc(100vh - var(--nav-h));
  overflow-y: auto; overflow-x: hidden;
  border-right: 1px solid var(--border);
  background: var(--bg);
  display: flex; flex-direction: column;
  padding: 12px 0;
  transition: background .2s;
}
.sidebar-search-wrap {
  display: flex; align-items: center; gap: 8px;
  margin: 0 12px 10px;
  background: var(--bg-3); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 12px;
  cursor: text; transition: border-color .15s;
}
.sidebar-search-wrap:focus-within { border-color: var(--border-hi); }
.sidebar-search-icon { font-size: 13px; color: var(--text-3); flex-shrink: 0; }
#sidebar-search {
  background: none; border: none; outline: none;
  font-family: var(--sans); font-size: 13px; color: var(--text);
  width: 100%; cursor: text;
}
#sidebar-search::placeholder { color: var(--text-3); }
.sidebar-nav { flex: 1; overflow-y: auto; }

.nav-group { margin-bottom: 2px; }
.nav-group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; width: 100%; border: none; background: none;
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  letter-spacing: .8px; text-transform: uppercase;
  color: var(--text-3); cursor: pointer; text-align: left;
  transition: color .15s;
}
.nav-group-header:hover { color: var(--text-2); }
.nav-group-toggle { font-size: 9px; transition: transform .2s; }
.nav-group.open .nav-group-toggle { transform: rotate(90deg); }
.nav-group-items { display: none; padding-bottom: 4px; }
.nav-group.open .nav-group-items { display: block; }
.nav-item {
  display: block; padding: 7px 16px 7px 28px;
  font-size: 13px; color: var(--text-2); text-decoration: none;
  border-left: 2px solid transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background .1s, color .1s, border-color .1s;
}
.nav-item:hover { background: var(--bg-3); color: var(--text); text-decoration: none; }
.nav-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-dim); }
mark { background: var(--accent-dim); color: var(--accent); border-radius: 2px; padding: 0 2px; }

/* ══ MAIN CONTENT ══ */
.main { grid-area: main; min-width: 0; padding: 48px 40px 80px; }
.doc-body { max-width: var(--content-max); margin: 0 auto; }

/* Typography */
.doc-body h1 { font-size: 2rem; font-weight: 800; line-height: 1.2; margin-bottom: 16px; letter-spacing: -.5px; }
.doc-body h2 { font-size: 1.35rem; font-weight: 700; margin: 40px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.doc-body h3 { font-size: 1.1rem; font-weight: 700; margin: 28px 0 8px; }
.doc-body h4 { font-size: 1rem; font-weight: 700; margin: 20px 0 6px; color: var(--text-2); }
.doc-body p  { margin-bottom: 16px; font-size: 15px; line-height: 1.8; }
.doc-body ul, .doc-body ol { margin: 0 0 16px 24px; }
.doc-body li { margin-bottom: 6px; font-size: 15px; line-height: 1.7; }
.doc-body hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
.doc-body strong { font-weight: 700; }
.doc-body em { font-style: italic; }
.doc-body a { color: var(--accent); }
.doc-body a:hover { text-decoration: underline; }

/* Code */
.doc-body code {
  font-family: var(--mono); font-size: 13px;
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 6px;
}
.doc-body pre {
  background: var(--code-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin: 0 0 20px;
  overflow-x: auto; position: relative;
}
.doc-body pre code { background: none; border: none; padding: 0; font-size: 13px; line-height: 1.7; }
.copy-btn {
  position: absolute; top: 10px; right: 10px;
  background: var(--bg-4); border: 1px solid var(--border);
  color: var(--text-2); border-radius: 6px;
  font-family: var(--mono); font-size: 11px; padding: 4px 10px;
  cursor: pointer; opacity: 0; transition: opacity .15s;
}
.doc-body pre:hover .copy-btn { opacity: 1; }
.copy-btn:hover { background: var(--bg-5); color: var(--text); }

/* Tables */
.doc-body table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; }
.doc-body th { background: var(--bg-3); font-weight: 700; text-align: left; padding: 10px 14px; border: 1px solid var(--border); }
.doc-body td { padding: 9px 14px; border: 1px solid var(--border); vertical-align: top; }
.doc-body tr:hover td { background: var(--bg-3); }

/* Callout boxes */
.doc-body blockquote {
  border-left: 3px solid var(--border-hi); background: var(--bg-3);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 14px 18px; margin: 0 0 20px; color: var(--text-2); font-size: 14px;
}
.callout-note { border-left-color: var(--blue) !important; background: var(--callout-note-bg) !important; color: var(--text) !important; }
.callout-warn { border-left-color: var(--yellow) !important; background: var(--callout-warn-bg) !important; color: var(--text) !important; }
.callout-tip  { border-left-color: var(--green) !important; background: var(--callout-tip-bg) !important; color: var(--text) !important; }

/* Heading anchors */
.heading-anchor { margin-left: 8px; color: var(--text-3); font-weight: 400; font-size: .85em; opacity: 0; transition: opacity .15s; text-decoration: none; }
h2:hover .heading-anchor, h3:hover .heading-anchor { opacity: 1; }

/* Prev / Next nav */
.doc-nav {
  max-width: var(--content-max); margin: 48px auto 0;
  display: flex; justify-content: space-between; gap: 16px;
  padding-top: 24px; border-top: 1px solid var(--border);
}
.doc-nav-link {
  display: flex; flex-direction: column; gap: 4px;
  padding: 14px 18px; border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text-2); text-decoration: none;
  font-size: 13px; flex: 1; max-width: 48%;
  transition: border-color .15s, background .15s;
}
.doc-nav-link:hover { border-color: var(--accent); background: var(--accent-dim); text-decoration: none; }
.doc-nav-link.prev { align-items: flex-start; }
.doc-nav-link.next { align-items: flex-end; text-align: right; }
.doc-nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-3); font-weight: 700; }
.doc-nav-title { font-weight: 700; color: var(--text); font-size: 14px; }

/* ══ TOC (On This Page) ══ */
.toc-aside {
  grid-area: toc;
  position: sticky; top: var(--nav-h);
  height: calc(100vh - var(--nav-h));
  overflow-y: auto; padding: 32px 12px 32px 4px;
}
.toc-inner { padding-left: 4px; }
.toc-label {
  font-size: 11px; font-weight: 700; letter-spacing: .8px;
  text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; padding-left: 12px;
}
.toc-nav { display: flex; flex-direction: column; gap: 1px; }
.toc-item {
  display: block; font-size: 12px; color: var(--text-2); padding: 4px 12px;
  border-left: 2px solid transparent; text-decoration: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color .1s, border-color .1s;
}
.toc-item:hover { color: var(--text); text-decoration: none; }
.toc-item.active { color: var(--accent); border-left-color: var(--accent); }
.toc-item.toc-h3 { padding-left: 22px; font-size: 11px; }

/* ══ SEARCH MODAL ══ */
.search-modal {
  position: fixed; inset: 0; z-index: 500;
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 80px;
  visibility: hidden; opacity: 0;
  transition: opacity .15s, visibility .15s;
}
.search-modal.open { visibility: visible; opacity: 1; }
.search-backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
}
.search-dialog {
  position: relative; z-index: 1;
  background: var(--bg-3); border: 1px solid var(--border-hi);
  border-radius: 16px; width: 100%; max-width: 600px;
  overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,.5);
  transform: scale(.96) translateY(-8px);
  transition: transform .15s;
}
.search-modal.open .search-dialog { transform: scale(1) translateY(0); }
.search-input-row {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.search-icon-glyph { font-size: 16px; color: var(--text-3); flex-shrink: 0; }
#modal-search-input {
  flex: 1; background: none; border: none; outline: none;
  font-family: var(--sans); font-size: 16px; color: var(--text);
}
#modal-search-input::placeholder { color: var(--text-3); }
.search-esc-hint {
  font-family: var(--mono); font-size: 10px; color: var(--text-3);
  background: var(--bg-4); border: 1px solid var(--border);
  border-radius: 4px; padding: 3px 7px; flex-shrink: 0;
}
.search-results { max-height: 420px; overflow-y: auto; padding: 8px 0; }
.search-results-empty {
  text-align: center; color: var(--text-3); padding: 32px; font-size: 14px;
}
.search-group-label {
  font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
  color: var(--text-3); padding: 10px 20px 4px;
}
.search-result {
  display: flex; flex-direction: column; gap: 3px;
  padding: 10px 20px; cursor: pointer;
  border-left: 2px solid transparent;
  transition: background .1s, border-color .1s;
}
.search-result:hover, .search-result.focused {
  background: var(--bg-4); border-left-color: var(--accent);
}
.search-result-title   { font-size: 14px; font-weight: 700; color: var(--text); }
.search-result-excerpt { font-size: 12px; color: var(--text-2); line-height: 1.5; }
.search-result-excerpt mark { background: none; color: var(--accent); font-weight: 700; }
.search-footer {
  display: flex; gap: 20px; padding: 10px 20px;
  border-top: 1px solid var(--border); font-size: 11px; color: var(--text-3);
}
.search-footer kbd {
  font-family: var(--mono); font-size: 10px;
  background: var(--bg-4); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px; margin-right: 4px;
}

/* ══ MOBILE SIDEBAR BACKDROP ══ */
.sidebar-back-overlay {
  display: none; position: fixed; inset: 0; z-index: 140;
  background: rgba(0,0,0,.5);
}
.sidebar-back-overlay.visible { display: block; }

/* ══ RESPONSIVE ══ */
@media (max-width: 1200px) {
  .layout { grid-template-columns: var(--sidebar-w) 1fr; grid-template-areas: "sidebar main"; }
  .toc-aside { display: none; }
}

@media (max-width: 768px) {
  .layout { grid-template-columns: 1fr; grid-template-areas: "main"; }
  .sidebar {
    position: fixed; top: var(--nav-h); left: 0; bottom: 0;
    width: 280px; z-index: 150;
    transform: translateX(-100%); transition: transform .25s ease;
  }
  .sidebar.mobile-open { transform: translateX(0); box-shadow: 8px 0 40px rgba(0,0,0,.4); }
  .mobile-menu-btn { display: flex !important; }
  .main { padding: 28px 20px 60px; }
  .doc-nav { flex-direction: column; }
  .doc-nav-link { max-width: 100%; }
  #cmd-k-btn span:not(kbd) { display: none; }
  .search-modal { padding: 20px 12px; align-items: flex-start; }
  .version-badge { display: none; }
}
  </style>
</head>
<body class="dark">

<nav id="nav">
  <div class="nav-left">
    <button id="mobile-menu-btn" class="icon-btn mobile-menu-btn" aria-label="Open menu">☰</button>
    <a href="https://irdoc.io" class="nav-logo">
      <img id="nav-logo-img" src="irdoc_dark.svg" alt="IRDoc">
      <span class="logo-sep">/</span>
      <span class="logo-docs">Docs</span>
    </a>
  </div>
  <div class="nav-right">
    <span class="version-badge">v0.1-alpha</span>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">🌙</button>
    <button id="cmd-k-btn" class="icon-btn" aria-label="Search docs">
      <span>Search</span><kbd>⌘K</kbd>
    </button>
  </div>
</nav>

<div class="layout">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-search-wrap" id="sidebar-search-wrap">
      <span class="sidebar-search-icon">🔍</span>
      <input id="sidebar-search" type="text" placeholder="Search docs..." autocomplete="off">
    </div>
    <nav id="sidebar-nav" class="sidebar-nav"></nav>
  </aside>

  <main id="main" class="main">
    <div class="doc-body" id="doc-body"></div>
    <div class="doc-nav" id="doc-nav"></div>
  </main>

  <aside id="toc-aside" class="toc-aside">
    <div class="toc-inner">
      <p class="toc-label">On this page</p>
      <nav id="toc-nav" class="toc-nav"></nav>

  </aside>
</div>

<div id="search-modal" class="search-modal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="search-backdrop" id="search-backdrop"></div>

</div>
<div id="sidebar-backdrop" class="sidebar-back-overlay"></div>

<script>
// ── Manifest ───────────────────────────────────────────
const MANIFEST = [
  { id: 'Installation', items: [
    { path: 'installation/wizard',                title: 'Installation & Upgrade Wizard' },
    { path: 'installation/docker-compose',        title: 'Docker Compose Setup' },
    { path: 'installation/environment-variables', title: 'Environment Variables' },
    { path: 'installation/upgrading',             title: 'Upgrading' },
    { path: 'installation/backup-restore',        title: 'Backup & Restore' },
    { path: 'installation/troubleshooting',       title: 'Troubleshooting' },
  ]},
  { id: 'User Guide', items: [
    { path: 'user-guide/creating-incidents',      title: 'Creating and Managing Incidents' },
    { path: 'user-guide/dashboard',               title: 'Dashboard' },
    { path: 'user-guide/timeline',                title: 'Timeline' },
    { path: 'user-guide/ioc-management',          title: 'IOC Management' },
    { path: 'user-guide/assets',                  title: 'Assets' },
    { path: 'user-guide/tasks',                   title: 'Tasks' },
    { path: 'user-guide/investigation-graph',     title: 'Investigation Graph' },
    { path: 'user-guide/generating-reports',      title: 'Generating Reports' },
    { path: 'user-guide/report-template-builder', title: 'Report Template Builder' },

const FLAT = MANIFEST.flatMap(s => s.items.map(i => ({ ...i, section: s.id })));

// ── Sidebar state ──────────────────────────────────────
let activeDocPath = null;

function getActiveGroupId() {
  if (!activeDocPath) return MANIFEST[0].id;
  return (MANIFEST.find(g => g.items.some(i => i.path === activeDocPath)) || MANIFEST[0]).id;
}

function renderSidebar(filter) {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  const q = (filter || '').toLowerCase().trim();

  for (const group of MANIFEST) {
    const matchingItems = q
      ? group.items.filter(i => i.title.toLowerCase().includes(q))
      : group.items;
    if (matchingItems.length === 0) continue;

    const isOpen = q ? true : group.id === getActiveGroupId();
    const div = document.createElement('div');
    div.className = 'nav-group' + (isOpen ? ' open' : '');

    const header = document.createElement('button');
    header.className = 'nav-group-header';
    header.innerHTML = `${group.id} <span class="nav-group-toggle">&#9654;</span>`;
    header.addEventListener('click', () => div.classList.toggle('open'));

    const items = document.createElement('div');
    items.className = 'nav-group-items';

    for (const item of matchingItems) {
      const a = document.createElement('a');
      a.className = 'nav-item' + (item.path === activeDocPath ? ' active' : '');
      a.href = '#' + item.path;
      if (q) {
        const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        a.innerHTML = item.title.replace(re, '<mark>$1</mark>');
      } else {
        a.textContent = item.title;
      }
      a.addEventListener('click', () => closeMobileDrawer());
      items.appendChild(a);
    }

    div.appendChild(header);
    div.appendChild(items);
    nav.appendChild(div);
  }
}

function setActiveDoc(path) {
  activeDocPath = path;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('href') === '#' + path);
  });
  // Ensure the group containing this doc is open
  const group = MANIFEST.find(g => g.items.some(i => i.path === path));
  if (group) {
    document.querySelectorAll('.nav-group').forEach(el => {
      const h = el.querySelector('.nav-group-header');
      if (h && h.textContent.trim().startsWith(group.id)) el.classList.add('open');
    });
  }
  const activeEl = document.querySelector('.nav-item.active');
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
}

// Stubs — replaced in Tasks 5, 6, 7
let tocObserver = null;
let fuseIndex = null;

function buildTOC() {
  const nav = document.getElementById('toc-nav');
  nav.innerHTML = '';
  if (tocObserver) { tocObserver.disconnect(); tocObserver = null; }

  const headings = document.querySelectorAll('#doc-body h2, #doc-body h3');
  const aside = document.getElementById('toc-aside');
  aside.style.visibility = headings.length === 0 ? 'hidden' : '';

  headings.forEach(h => {
    const a = document.createElement('a');
    a.className = 'toc-item' + (h.tagName === 'H3' ? ' toc-h3' : '');
    a.href = '#' + h.id;
    a.textContent = h.textContent.replace('#', '').trim();
    a.addEventListener('click', e => {
      e.preventDefault();
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    nav.appendChild(a);
  });

  tocObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const link = nav.querySelector(`[href="#${entry.target.id}"]`);
      if (link) link.classList.toggle('active', entry.isIntersecting);
    });
  }, { rootMargin: '-60px 0px -70% 0px', threshold: 0 });

  headings.forEach(h => tocObserver.observe(h));
}

function buildSearchIndex() {
  const items = Object.entries(DOCS).map(([path, doc]) => ({
    path,
    title:   doc.title,
    section: doc.section,
    content: doc.content
      .replace(/#{1,6}\s+/g, '')
      .replace(/[*_`\[\]()]/g, '')
      .replace(/\n+/g, ' ')
      .slice(0, 10000),
  }));
  fuseIndex = new Fuse(items, {
    keys: [
      { name: 'title',   weight: 0.6 },
      { name: 'content', weight: 0.4 },
    ],
    threshold: 0.35,
    includeMatches: true,
    minMatchCharLength: 2,
  });
}

// ── ⌘K Search Modal ────────────────────────────────────
let modalResultPaths = [];
let focusedIdx = -1;

function openSearchModal() {
  const modal = document.getElementById('search-modal');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
  const input = document.getElementById('modal-search-input');
  input.value = '';
  renderModalResults('');
  setTimeout(() => input.focus(), 60);
}

function closeSearchModal() {
  document.getElementById('search-modal').classList.remove('open');
  document.getElementById('search-modal').setAttribute('aria-hidden', 'true');
  focusedIdx = -1;
}

function renderModalResults(query) {
  const container = document.getElementById('search-results');
  container.innerHTML = '';
  modalResultPaths = [];
  focusedIdx = -1;

  const q = query.trim();
  let results;

  if (!fuseIndex || q.length < 2) {
    results = FLAT.slice(0, 8).map(i => ({ item: { ...i, content: '' }, matches: [] }));
  } else {
    results = fuseIndex.search(q, { limit: 12 });
  }

  if (results.length === 0) {
    const p = document.createElement('p');
    p.className = 'search-results-empty';
    p.textContent = `No results for "${q}"`;
    container.appendChild(p);
    return;
  }

  // Group by section
  const grouped = {};
  for (const r of results) {
    const sec = r.item.section;
    (grouped[sec] = grouped[sec] || []).push(r);
  }

  for (const [section, items] of Object.entries(grouped)) {
    const label = document.createElement('div');
    label.className = 'search-group-label';
    label.textContent = section;
    container.appendChild(label);

    for (const r of items) {
      const { path, title, content } = r.item;
      const resultIdx = modalResultPaths.length;
      modalResultPaths.push(path);

      let excerpt = '';
      if (q.length >= 2 && content) {
        const lower = content.toLowerCase();
        const pos   = lower.indexOf(q.toLowerCase());
        if (pos !== -1) {
          const start = Math.max(0, pos - 40);
          const end   = Math.min(content.length, pos + 90);
          const raw   = content.slice(start, end).trim();
          const re    = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
          excerpt = (start > 0 ? '…' : '') + raw.replace(re, '<mark>$1</mark>') + (end < content.length ? '…' : '');
        }
      }

      const div = document.createElement('div');
      div.className = 'search-result';
      const titleSpan = document.createElement('span');
      titleSpan.className = 'search-result-title';
      titleSpan.textContent = title;
      div.appendChild(titleSpan);
      if (excerpt) {
        const excerptSpan = document.createElement('span');
        excerptSpan.className = 'search-result-excerpt';
        excerptSpan.innerHTML = excerpt;
        div.appendChild(excerptSpan);
      }
      div.addEventListener('click', () => { location.hash = path; closeSearchModal(); });
      div.addEventListener('mouseenter', () => { focusedIdx = resultIdx; updateModalFocus(); });
      container.appendChild(div);
    }
  }
}

function updateModalFocus() {
  document.querySelectorAll('.search-result').forEach((el, i) => {
    el.classList.toggle('focused', i === focusedIdx);
    if (i === focusedIdx) el.scrollIntoView({ block: 'nearest' });
  });
}

// Modal input events
document.getElementById('modal-search-input').addEventListener('input', e => renderModalResults(e.target.value));
document.getElementById('modal-search-input').addEventListener('keydown', e => {
  const total = modalResultPaths.length;
  if (e.key === 'ArrowDown') { e.preventDefault(); focusedIdx = Math.min(focusedIdx + 1, total - 1); updateModalFocus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); focusedIdx = Math.max(focusedIdx - 1, 0); updateModalFocus(); }
  else if (e.key === 'Enter' && focusedIdx >= 0) { location.hash = modalResultPaths[focusedIdx]; closeSearchModal(); }
  else if (e.key === 'Escape') closeSearchModal();
});
document.getElementById('search-backdrop').addEventListener('click', closeSearchModal);

// Global ⌘K / Ctrl+K
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('search-modal').classList.contains('open') ? closeSearchModal() : openSearchModal(); }
  if (e.key === 'Escape' && document.getElementById('search-modal').classList.contains('open')) closeSearchModal();
});
document.getElementById('cmd-k-btn').addEventListener('click', openSearchModal);

// ── Mobile drawer ──────────────────────────────────────
function closeMobileDrawer() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebar-backdrop').classList.remove('visible');
}

document.getElementById('mobile-menu-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('mobile-open');
  document.getElementById('sidebar-backdrop').classList.toggle('visible');
});
document.getElementById('sidebar-backdrop').addEventListener('click', closeMobileDrawer);

// Sidebar search input — live filter with Enter to navigate and Escape to clear
const sidebarSearch = document.getElementById('sidebar-search');
sidebarSearch.addEventListener('input', () => {
  const filter = sidebarSearch.value;
  renderSidebar(filter);
});
sidebarSearch.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    sidebarSearch.value = '';
    renderSidebar('');
  } else if (e.key === 'Enter') {
    // Navigate to the first search result
    const firstLink = document.querySelector('.sidebar-nav .nav-item');
    if (firstLink) {
      location.hash = firstLink.getAttribute('href').slice(1);
      sidebarSearch.value = '';
      renderSidebar('');
    }
  }
});

// Initial sidebar render
renderSidebar();
</script>

<script>
// ── Docs data ──────────────────────────────────────────
let DOCS = {};

async function initDocs() {
  const res = await fetch('docs-content.json');
  const data = await res.json();
  DOCS = data.docs;
  buildSearchIndex();
  routeFromHash();
}

function routeFromHash() {
  const path = location.hash.slice(1) || 'installation/wizard';
  loadDoc(path);
}
window.addEventListener('hashchange', routeFromHash);

function loadDoc(path) {
  const doc = DOCS[path];
  if (!doc) {
    const body = document.getElementById('doc-body');
    body.textContent = '';
    const p = document.createElement('p');
    p.style.cssText = 'color:var(--text-2);margin-top:40px';
    p.append('Page not found: ');
    const code = document.createElement('code');
    code.textContent = path;
    p.appendChild(code);
    body.appendChild(p);
    return;
  }
  const body = document.getElementById('doc-body');
  body.innerHTML = postProcess(marked.parse(doc.content));
  document.title = doc.title + ' — IRDoc Docs';
  setActiveDoc(path);
  updateDocNav(path);
  buildTOC();
  body.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  window.scrollTo(0, 0);
  document.getElementById('main').scrollTo(0, 0);
}

function postProcess(html) {
  const div = document.createElement('div');
  div.innerHTML = html;

  // Heading anchors
  div.querySelectorAll('h2, h3').forEach(h => {
    const id = h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    h.id = id;
    const a = document.createElement('a');
    a.className = 'heading-anchor'; a.href = '#' + id; a.textContent = '#';
    h.appendChild(a);
  });

  // Copy buttons
  div.querySelectorAll('pre').forEach(pre => {
    const btn = document.createElement('button');
    btn.className = 'copy-btn'; btn.textContent = 'Copy';
    btn.addEventListener('click', () => {
      const code = pre.querySelector('code');
      navigator.clipboard.writeText(code ? code.textContent : pre.textContent);
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 2000);
    });
    pre.appendChild(btn);
  });

  // Callout boxes
  div.querySelectorAll('blockquote').forEach(bq => {
    const t = bq.textContent.trim().toLowerCase();
    if (t.startsWith('note') || t.includes('**note:**'))    bq.classList.add('callout-note');
    else if (t.startsWith('warning') || t.includes('**warning:**')) bq.classList.add('callout-warn');
    else if (t.startsWith('tip') || t.includes('**tip:**'))     bq.classList.add('callout-tip');
  });

  return div.innerHTML;
}

function updateDocNav(path) {
  const idx = FLAT.findIndex(i => i.path === path);
  const prev = idx > 0 ? FLAT[idx - 1] : null;
  const next = idx < FLAT.length - 1 ? FLAT[idx + 1] : null;
  const nav = document.getElementById('doc-nav');
  nav.innerHTML = '';

  if (prev) {
    const a = document.createElement('a');
    a.className = 'doc-nav-link prev'; a.href = '#' + prev.path;
    a.innerHTML = `<span class="doc-nav-label">← Previous</span><span class="doc-nav-title">${prev.title}</span>`;
    nav.appendChild(a);
  } else {
    nav.appendChild(document.createElement('div'));
  }
  if (next) {
    const a = document.createElement('a');
    a.className = 'doc-nav-link next'; a.href = '#' + next.path;
    a.innerHTML = `<span class="doc-nav-label">Next →</span><span class="doc-nav-title">${next.title}</span>`;
    nav.appendChild(a);
  }
}

initDocs();
</script>
