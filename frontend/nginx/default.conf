# IRDoc default nginx config: plain HTTP on port 80.
#
# Shipped in the frontend image at /etc/nginx/irdoc/default.conf and used
# whenever the install has no docker/nginx/local/nginx.conf of its own (see
# 90-irdoc-select-conf.sh). Because it lives in the image, it always matches
# the snippet and paths that image ships (#131), and installs never have to
# edit a tracked file to change it (#114).
#
# For HTTPS or any other change, put a full config in docker/nginx/local/nginx.conf
# (the installer wizard writes one for you). Start from this file or from
# docker/nginx/examples/.

upstream backend {
    # irdoc-backend is the backend container_name in both compose files.
    server irdoc-backend:8000;
}

server {
    listen 80;
    server_name _;

    # CSP and the other security headers ship in the frontend image (#57).
    include /etc/nginx/snippets/irdoc-security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 55m;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
