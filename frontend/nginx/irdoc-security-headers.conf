# IRDoc security headers. Shipped in the frontend image at
# /etc/nginx/snippets/irdoc-security-headers.conf and `include`d by every
# nginx config (the generated host config, the tracked default and the
# image's own default.conf). Because it lives in the image, a header change
# reaches existing installs on their next upgrade; before #57 the headers sat
# in the host's bind-mounted nginx.conf and never changed after install.
#
# HSTS is not here: it depends on the HTTPS mode, so it stays in the host config.
#
# CSP relaxations, all required by the SPA - each one was verified as needed:
#   style-src 'unsafe-inline' - TipTap/ProseMirror injects a <style> tag at
#     runtime, and the dashboard renders a <style> block for keyframes. A nonce
#     is not an option here: nginx serves index.html as a static file.
#   img-src data: - logo previews and pasted rich-text images are read client
#     side as base64 data URIs; blob: - attachment and export previews.
# Fonts are self-hosted, so no third-party style/font origin is allowed.
#
# Stored attachments (/api/v1/files/) get their own policy: the app frames
# them for the PDF preview (#137), so frame-ancestors 'self' / SAMEORIGIN
# instead of 'none' / DENY; no scripts at all; object-src 'self' for the
# browser's PDF viewer. Must match _FILES_CSP in backend/app/main.py (the
# browser enforces both copies). `set`/`if` work here because this file is
# included at server level; add_header takes the variables.
set $irdoc_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';";
set $irdoc_frame_options "DENY";
if ($uri ~ ^/api/v1/files/) {
    set $irdoc_csp "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; object-src 'self'; frame-ancestors 'self';";
    set $irdoc_frame_options "SAMEORIGIN";
}
add_header Content-Security-Policy $irdoc_csp always;
add_header X-Frame-Options $irdoc_frame_options always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
