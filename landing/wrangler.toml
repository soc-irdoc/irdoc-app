name = "irdoc-landing"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# KV namespace used for the waitlist counter and IP rate limiting.
# Create it with: wrangler kv:namespace create WAITLIST
# Then replace the IDs below.
[[kv_namespaces]]
binding = "WAITLIST"
id = "f5b37ae77f1249c1b079bbf022bb93af"
preview_id = "8a578eb1abad4bcdb0a0b72c2f34ff6b"

# Set these as Environment Variables in the Cloudflare Pages dashboard
# (Settings > Environment variables):
#   BREVO_API_KEY  — Secret  — your Brevo API key
#   BREVO_LIST_ID  — Plain text — numeric list ID from Brevo (e.g. 4)
